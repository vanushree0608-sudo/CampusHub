
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Team Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fc;
            color: #20233a;
        }

        header {
            background: #4338ca;
            color: white;
            padding: 18px 24px;
        }

        header h2 {
            margin: 0 0 8px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .chat-container {
            max-width: 800px;
            height: calc(100vh - 120px);
            min-height: 400px;
            margin: 20px auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px #00000012;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-heading {
            padding: 16px;
            border-bottom: 1px solid #e8e8ef;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            background: #eef0ff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            max-width: 85%;
            overflow-wrap: anywhere;
        }

        .message.mine {
            background: #4338ca;
            color: white;
            margin-left: auto;
        }

        .sender {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .message-time {
            display: block;
            font-size: 11px;
            margin-top: 7px;
            opacity: 0.75;
        }

        #status {
            padding: 8px 16px;
            font-size: 13px;
            color: #666;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #e8e8ef;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #d5d7e3;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 9px;
            background: #4338ca;
            color: white;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .chat-container {
                margin: 10px;
                height: calc(100vh - 110px);
            }
        }
    </style>

    <!-- Socket.IO client supplied by the backend -->
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

    <header>
        <h2>CampusHub 💬</h2>
        <a href="projects.html">← Back to Projects</a>
    </header>

    <main class="chat-container">
        <div class="chat-heading">
    <div id="projectTitle">Project Team Chat</div>
    <div id="onlineStatus" style="font-size: 12px; font-weight: normal; margin-top: 6px; color: #16a34a;">
        🟢 Waiting for teammates...
    </div>
</div>

        <div id="messages">Loading messages...</div>

        <div id="status">Connecting to chat...</div>

        <form id="messageForm">
            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                maxlength="2000"
                autocomplete="off"
                required
            >
            <button type="submit" id="sendButton">Send</button>
        </form>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const projectId = params.get("projectId");

        const messagesBox = document.getElementById("messages");
        const statusBox = document.getElementById("status");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const messageForm = document.getElementById("messageForm");
        messageInput.addEventListener("input", () => {
    if (socket && joinedProject && messageInput.value.trim()) {
        socket.emit("typing", projectId);
    }
});

        let currentUserId = null;
        let socket = null;
        let joinedProject = false;

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                credentials: "include",
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Request failed.");
            }

            return data;
        }

        function showStatus(message) {
            statusBox.textContent = message;
        }

        function formatTime(value) {
            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            return date.toLocaleString();
        }

        function renderMessage(message) {
            // Avoid displaying the same message twice.
            if (
                message.id &&
                messagesBox.querySelector(
                    `[data-message-id="${message.id}"]`
                )
            ) {
                return;
            }

            const wasNearBottom =
                messagesBox.scrollHeight -
                messagesBox.scrollTop -
                messagesBox.clientHeight < 60;

            const emptyMessage = messagesBox.querySelector(".empty-message");
            if (emptyMessage) {
                emptyMessage.remove();
            }

            const bubble = document.createElement("div");
            bubble.className = "message";

            if (message.id) {
                bubble.dataset.messageId = message.id;
            }

            if (Number(message.sender_id) === Number(currentUserId)) {
                bubble.classList.add("mine");
            }

            const sender = document.createElement("span");
            sender.className = "sender";
            sender.textContent = message.sender_name || "Student";

            const content = document.createElement("div");
            content.textContent = message.message;

            const time = document.createElement("span");
            time.className = "message-time";
            time.textContent = formatTime(message.created_at);
            const receipt = document.createElement("span");
receipt.className = "read-receipt";

if (Number(message.sender_id) === Number(currentUserId)) {
    receipt.textContent = message.read_at ? "✓✓" : "✓";
    receipt.style.color = message.read_at ? "#2196f3" : "#9ca3af";
    receipt.style.marginLeft = "6px";
}

            bubble.append(sender, content, time);

if (Number(message.sender_id) === Number(currentUserId)) {
    time.appendChild(receipt);
}
            messagesBox.appendChild(bubble);

            if (wasNearBottom) {
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }
        }

        async function loadMessages() {
            const data = await apiRequest(
                `/api/projects/${encodeURIComponent(projectId)}/messages`
            );

            messagesBox.replaceChildren();

            if (!data.messages || data.messages.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-message";
                empty.textContent =
                    "No messages yet. Say hello to your team! 👋";
                messagesBox.appendChild(empty);
                return;
            }

            data.messages.forEach(renderMessage);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function connectLiveChat() {
            socket = io();

            socket.on("connect", () => {
                joinedProject = false;
                showStatus("Connecting to project chat...");

                socket.emit("joinProject", projectId);
            });

            socket.on("projectJoined", (joinedProjectId) => {
                if (Number(joinedProjectId) === Number(projectId)) {
                    joinedProject = true;
                    showStatus("🟢 Live chat connected");
                }
            });

            socket.on("newMessage", (message) => {
                if (Number(message.project_id) !== Number(projectId)) {
                    return;
                }

                renderMessage(message);
            });
            socket.on("onlineUsers", (userIds) => {
    const otherUsersOnline = userIds.filter(
        id => Number(id) !== Number(currentUserId)
    );

    const status = document.getElementById("onlineStatus");

    if (otherUsersOnline.length > 0) {
        status.textContent = "🟢 " + otherUsersOnline.length +
            (otherUsersOnline.length === 1
                ? " teammate online"
                : " teammates online");
    } else {
        status.textContent = "⚪ No teammates online";
    }
});
socket.on("userTyping", (data) => {
    if (
        Number(data.projectId) !== Number(projectId) ||
        Number(data.userId) === Number(currentUserId)
    ) {
        return;
    }

    showStatus("Someone is typing...");
});
            socket.on("connect_error", (error) => {
                joinedProject = false;
                showStatus(error.message || "Live connection failed.");
            });

            socket.on("disconnect", () => {
                joinedProject = false;
                showStatus("Reconnecting to live chat...");
            });
        }

        async function initializeChat() {
            if (!projectId || !/^\d+$/.test(projectId)) {
                showStatus("Project ID missing. Open chat from a project.");
                messageInput.disabled = true;
                sendButton.disabled = true;
                return;
            }

            messageInput.disabled = true;
            sendButton.disabled = true;

            try {
                const data = await apiRequest("/api/auth/me");
                currentUserId = data.user.id;

                document.getElementById("projectTitle").textContent =
                    `Project #${projectId} — Team Chat`;

                await loadMessages();

                connectLiveChat();
            } catch (error) {
                showStatus(error.message);
                messageInput.disabled = true;
                sendButton.disabled = true;
            }
        }

        messageForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = messageInput.value.trim();

            if (!message || !projectId || !joinedProject) {
                if (!joinedProject) {
                    showStatus("Please wait for the live chat to connect.");
                }
                return;
            }

            sendButton.disabled = true;

            try {
                await apiRequest(
                    `/api/projects/${encodeURIComponent(projectId)}/messages`,
                    {
                        method: "POST",
                        body: JSON.stringify({ message })
                    }
                );

                messageInput.value = "";
                messageInput.focus();
            } catch (error) {
                showStatus(error.message);
            } finally {
                sendButton.disabled = !joinedProject;
            }
        });

        // Enable sending only after joining the project room.
        document.addEventListener("DOMContentLoaded", () => {
            const observer = new MutationObserver(() => {
                if (joinedProject) {
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                }
            });

            observer.observe(statusBox, {
                childList: true,
                characterData: true,
                subtree: true
            });
        });

        initializeChat();
    </script>

</body>
</html>
