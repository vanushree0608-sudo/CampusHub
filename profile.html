<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - CampusHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="profile-page">

        <!-- Navigation -->

        <nav class="navbar">

            <div class="logo">
                CampusHub
            </div>

            <div class="nav-links">

                <a href="dashboard.html">
                    Home
                </a>

                <a href="profile.html">
                    Profile
                </a>

            </div>

        </nav>


        <!-- Profile -->

        <main class="profile-container">

            <section class="profile-header">

                <div class="profile-picture">

                    <span id="profileInitial">
                        ?
                    </span>

                </div>


                <div class="profile-info">

                    <h1 id="profileUsername">
                        Username
                    </h1>

                    <p id="profileBio">
                        No bio added yet.
                    </p>

                    <p id="profileCollege">
                        College
                    </p>

                    <button id="editProfileBtn">
                        Edit Profile
                    </button>

                </div>

            </section>


            <!-- Profile Stats -->

            <section class="profile-stats">

                <div class="profile-stat">

                    <h3 id="projectCount">
                        0
                    </h3>

                    <p>
                        Projects
                    </p>

                </div>


                <div class="profile-stat">

                    <h3 id="pointsCount">
                        0
                    </h3>

                    <p>
                        Points
                    </p>

                </div>


                <div class="profile-stat">

                    <h3 id="ratingCount">
                        0
                    </h3>

                    <p>
                        Rating
                    </p>

                </div>

            </section>


            <!-- Skills -->

            <section class="profile-section">

                <h2>
                    Skills
                </h2>

                <div id="skillsContainer" class="skills-container">

                    <span class="skill-tag">
                        No skills added yet
                    </span>

                </div>

            </section>


            <!-- About -->

            <section class="profile-section">

                <h2>
                    About
                </h2>

                <p id="profileAbout">
                    No information added yet.
                </p>

            </section>


            <!-- Projects -->

            <section class="profile-section">

                <h2>
                    Projects
                </h2>

                <div id="projectsContainer">

                    <p>
                        No projects yet.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="js/profile.js"></script>

</body>

</html>
